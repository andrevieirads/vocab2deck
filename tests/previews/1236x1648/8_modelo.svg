<text x="30" y="877" text-anchor="start" style="font-family:Helvetica, Arial, sans-serif;font-size:28px" fill="#444444">No Anki Viewer, &quot;Show answer&quot; mostra a frente, um traço e o verso.</text>
<text x="30" y="928" text-anchor="start" style="font-family:Helvetica, Arial, sans-serif;font-size:28px" fill="#444444">Na revisão, &quot;✎ Campos do cartão&quot; deixa editar o texto de cada campo e</text>
<text x="30" y="964" text-anchor="start" style="font-family:Helvetica, Arial, sans-serif;font-size:28px" fill="#444444">criar campos só para aquele cartão.</text>
